services:
  backend:
    build:
      context: .
      dockerfile: example/Dockerfile
    container_name: nggorpc-backend
    ports:
      - "8080:8080"
    networks:
      - nggorpc-network

  frontend:
    build:
      context: .
      dockerfile: demo-app/Dockerfile
    container_name: nggorpc-frontend
    ports:
      - "8352:80"
    networks:
      - nggorpc-network
    depends_on:
      backend:
        condition: service_started

# E2E is deliberately NOT a compose service. CI runs Playwright from the official
# mcr.microsoft.com/playwright image against the services published here (see the
# "Run E2E tests" step in .github/workflows/ci.yml). The network-resilience specs
# shell out to `docker stop/start nggorpc-backend`, so the runner must sit outside
# the compose network, not inside it.

networks:
  nggorpc-network:
    driver: bridge
